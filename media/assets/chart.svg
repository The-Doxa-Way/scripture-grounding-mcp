<svg viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <style>
    :root { --bg: #ffffff; --text: #1a1a1a; --bar: #3b6ea5; --grid: #d7d7d7; }
